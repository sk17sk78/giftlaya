services:
  postgres:
    image: postgres:16-alpine
    container_name: giftlaya-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-giftlaya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-giftlaya_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-giftlaya}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-giftlaya} -d ${POSTGRES_DB:-giftlaya}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: giftlaya-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: giftlaya-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 4;
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      mc mb -p local/${S3_BUCKET:-giftlaya-media} || true;
      mc anonymous set download local/${S3_BUCKET:-giftlaya-media};
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: giftlaya-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-giftlaya}:${POSTGRES_PASSWORD:-giftlaya_dev_pass}@postgres:5432/${POSTGRES_DB:-giftlaya}?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:

